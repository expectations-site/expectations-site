<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPECTATIONS</title>
<meta name="description" content="EXPECTATIONS. Sign up to get first access to the next drops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --black:  #080808;
    --off:    #111214;
    --card:   #161618;
    --border: #1e1e22;
    --white:  #f2f0ec;
    --muted:  #555;
    --light:  #999;
    --gold:   #c9a84c;
    --gold-lo:rgba(201,168,76,.10);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    width:100%;
    overflow:hidden;
    position:fixed;
    background:var(--black);
    color:var(--white);
    font-family:'Barlow',sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    cursor:none;
  }
  body {
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 24px 40px;
    text-align:center;
    background-color:#000;
  }

  #cur{position:fixed;width:7px;height:7px;background:var(--white);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s;}
  #curR{position:fixed;width:34px;height:34px;border:1px solid rgba(255,255,255,.22);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .1s ease-out,top .1s ease-out,width .25s,height .25s;}

  .marquee {
    position:fixed;
    top:0; left:0; right:0;
    overflow:hidden;
    white-space:nowrap;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    z-index:100;
  }
  .marquee-track {
    display:inline-block;
    white-space:nowrap;
    animation:marqueeScroll 22s linear infinite;
  }
  .marquee-track span {
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:.5em;
    text-transform:uppercase;
    color:var(--white);
    margin:0 24px;
    opacity:.5;
  }
  @keyframes marqueeScroll {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }

  .gold-line {
    position:fixed;
    top:0; left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    z-index:200;
  }

  .content {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    animation:fadeUp .8s ease both;
  }

  .eyebrow {
    font-family:'Barlow Condensed',sans-serif;
    font-size:9px;
    letter-spacing:.55em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .eyebrow::before,
  .eyebrow::after {
    content:'';
    width:40px;
    height:1px;
    background:var(--gold);
    opacity:.4;
  }

  .message {
    font-family:'Cormorant Garamond', serif;
    font-style:normal;
    font-size:clamp(15px, 2vw, 26px);
    font-weight:600;
    line-height:1.6;
    color:var(--white);
    margin-bottom:18px;
    opacity:.9;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .logo-mark {
    width:clamp(150px, 20vw, 260px);
    height:auto;
    margin-bottom:10px;
    filter:invert(1) brightness(2);
    opacity:1;
    animation:logoSpin 12s linear infinite;
  }

  @keyframes logoSpin {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }

  .divider {
    width:1px;
    height:28px;
    background:linear-gradient(to bottom, transparent, var(--gold), transparent);
    margin:4px auto 18px;
    opacity:.5;
  }

  .signup {
    display:flex;
    align-items:stretch;
    gap:12px;
    width:100%;
    max-width:480px;
    margin-bottom:20px;
  }
  .email-input {
    flex:1;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:999px;
    padding:20px 28px;
    color:var(--white);
    font-family:'Barlow',sans-serif;
    font-size:15px;
    font-weight:300;
    outline:none;
  }
  .email-input::placeholder { color:rgba(255,255,255,.4); }
  .signup-btn {
    background:rgba(255,255,255,.9);
    color:var(--black);
    border:none;
    border-radius:999px;
    padding:20px 40px;
    font-family:'Barlow',sans-serif;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background .2s;
    white-space:nowrap;
  }
  .signup-btn:hover { background:var(--gold); }

  .success {
    display:none;
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:20px;
    border:1px solid var(--border);
    padding:18px 32px;
    background:var(--gold-lo);
  }
  .success.show { display:block; }
  .signup.hidden { display:none; }

  .socials { display:flex; gap:28px; align-items:center; }
  .socials a {
    color:var(--white);
    opacity:.2;
    transition:opacity .2s;
    display:flex;
    pointer-events:none;
    cursor:none;
  }
  .socials svg { width:20px; height:20px; fill:currentColor; }

  .bottom-tag {
    position:fixed;
    bottom:24px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:9px;
    letter-spacing:.4em;
    text-transform:uppercase;
    color:var(--muted);
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }

  @media (max-width:600px) {
    body { padding:70px 20px 30px; justify-content:center; }
    .eyebrow { font-size:8px; margin-bottom:14px; }
    .eyebrow::before, .eyebrow::after { width:24px; }
    .message { font-size:16px; margin-bottom:16px; line-height:1.4; }
    .logo-mark { width:clamp(120px, 32vw, 180px); margin-bottom:12px; }
    .divider { height:28px; margin:4px auto 18px; }
    .signup { flex-direction:row; gap:8px; max-width:100%; margin-bottom:10px; }
    .email-input { padding:14px 18px; font-size:13px; }
    .signup-btn { padding:14px 22px; font-size:13px; }
    .socials { gap:20px; }
    .socials svg { width:17px; height:17px; }
    .bottom-tag { font-size:8px; bottom:16px; }
  }
</style>
</head>
<body>

<div id="cur"></div>
<div id="curR"></div>
<div class="gold-line"></div>

  </div>
</div>

  <div class="eyebrow">Coming Soon</div>

  <p class="message">
    The wait begins.<br>
    Sign up for first access.
  </p>

  <img src="logo.png" class="logo-mark" alt="EXPECTATIONS">

  <div class="divider"></div>

  <form action="https://formspree.io/f/meewadro" method="POST" class="signup" id="signup" onsubmit="return handleSubmit(event)">
    <input type="email" name="email" class="email-input" placeholder="Email address" required>
    <button type="submit" class="signup-btn">Sign Up</button>
  </form>

  <div class="success" id="success">You're on the list. We'll be in touch.</div>

  </div>

</div>

<div class="bottom-tag">expectations.site</div>

<script>
  const cur = document.getElementById('cur');
  const curR = document.getElementById('curR');
  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX; my=e.clientY;
    cur.style.left=mx+'px'; cur.style.top=my+'px';
  });
  setInterval(()=>{ curR.style.left=mx+'px'; curR.style.top=my+'px'; },80);

  function handleSubmit(e){
    e.preventDefault();
    var form = document.getElementById('signup');
    var data = new FormData(form);
    fetch('https://formspree.io/f/meewadro', {
      method:'POST',
      body:data,
      headers:{ 'Accept':'application/json' }
    })
    .then(function(r){
      if(r.ok){ showSuccess(); }
      else { showSuccess(); }
    })
    .catch(function(){ showSuccess(); });
    return false;
  }

  function showSuccess(){
    document.getElementById('signup').classList.add('hidden');
    document.getElementById('success').classList.add('show');
  }
</script>
</body>
